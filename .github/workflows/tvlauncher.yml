name: Build TV Launcher APK

on:
  push:
    paths:
      - 'tvlauncher/**'
      - '.github/workflows/tvlauncher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tvlauncher
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure SDK packages (runner has the Android SDK preinstalled)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trillion-tv-launcher
          path: tvlauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
